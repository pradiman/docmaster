{% extends "base.html" %}

{% block title %}QR Code – DocMaster{% endblock %}

{% block content %}
    <h1 class="mb-4">QR Code for {{ filename }}</h1>

    <img src="{{ url_for('qr_image', filename=qr_filename) }}" alt="QR code" class="mb-3">

    <p>Scan this code to open the download link for <strong>{{ filename }}</strong>.</p>

    <a href="{{ url_for('download', filename=filename) }}" class="btn btn-success">
        Download {{ filename }}
    </a>
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
        Back to Home
    </a>
{% endblock %}
