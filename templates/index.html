{% extends "base.html" %}

{% block title %}DocMaster – Home{% endblock %}

{% block content %}
    <h1 class="mb-3">Welcome to DocMaster</h1>
    <p class="lead">A simple toolkit for merging PDFs, splitting PDFs, and converting images to PDF.</p>

    <div class="d-flex gap-2">
        <a href="{{ url_for('merge') }}" class="btn btn-outline-primary">Merge PDFs</a>
        <a href="{{ url_for('split') }}" class="btn btn-outline-primary">Split PDF</a>
        <a href="{{ url_for('images_to_pdf') }}" class="btn btn-outline-primary">Images → PDF</a>
    </div>
{% endblock %}
